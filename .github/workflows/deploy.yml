name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Push code to droplet (rsync)
        run: |
          rsync -avzr --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='chroma_db' \
            --exclude='.env' \
            --exclude='deploy_key' \
            --exclude='deploy_key.pub' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='.DS_Store' \
            ./ "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/app/tip-ecosystem-bot/"

      - name: Rebuild and restart container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /app/tip-ecosystem-bot
            docker compose up -d --build
            docker compose ps
